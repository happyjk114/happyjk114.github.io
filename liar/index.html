<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>라이어 게임</title>
<meta property="og:title" content="라이어 게임 하자">
<meta property="og:description" content="링크 열고 이름만 쓰면 바로 참가">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c0b10;--bg2:#2b1118;--ink:#fff4f2;--mute:#c9a9ae;--card:#fffaf8;--cardink:#1c0b10;--acc:#d7ff3a;--red:#ff5a6e;--line:#4a2029}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;min-height:100vh;-webkit-tap-highlight-color:transparent}
.wrap{max-width:480px;margin:0 auto;padding:20px 18px 48px}
h1,h2,.big{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;line-height:1.05;margin:0}
h1{font-size:52px}
h2{font-size:30px;margin-bottom:12px}
.mute{color:var(--mute)}.small{font-size:13px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border-radius:16px;font:800 18px "Noto Sans KR",sans-serif;cursor:pointer;margin-top:12px;background:var(--bg2);color:var(--ink);border:2px solid var(--line)}
.btn.pri{background:var(--acc);color:#1c0b10;border-color:var(--acc)}
.btn.ghost{background:transparent;min-height:46px;font-size:15px;font-weight:600}
.btn:disabled{opacity:.4}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input.txt{width:100%;height:58px;border-radius:16px;border:2px solid var(--line);background:var(--bg2);color:var(--ink);font:600 18px "Noto Sans KR";padding:0 16px}
input.code{height:72px;text-align:center;font:400 40px "Black Han Sans";letter-spacing:12px;text-transform:uppercase}
.label{font-weight:800;margin:20px 0 8px}
.err{color:var(--red);font-weight:600;min-height:22px;margin-top:8px}
.hero{position:relative;height:220px;margin:14px 0 4px}
.hero .c{position:absolute;width:118px;height:164px;border-radius:16px;background:var(--card);color:var(--cardink);display:flex;align-items:center;justify-content:center;font:400 50px "Black Han Sans";box-shadow:0 14px 30px rgba(0,0,0,.35)}
.hero .c1{left:calc(50% - 152px);top:40px;transform:rotate(-14deg)}
.hero .c2{left:calc(50% - 59px);top:12px;z-index:2;background:var(--acc)}
.hero .c3{left:calc(50% + 34px);top:40px;transform:rotate(14deg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 15px;border-radius:999px;border:2px solid var(--line);background:var(--bg2);color:var(--ink);font:600 15px "Noto Sans KR";cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#1c0b10}
.codebox{background:var(--card);color:var(--cardink);border-radius:20px;padding:16px;text-align:center}
.codebox .big{font-size:52px;letter-spacing:8px;padding-left:8px}
.plist{display:grid;gap:8px;margin-top:10px}
.p{display:flex;align-items:center;gap:10px;background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-height:52px}
.p .nm{flex:1;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p.off{opacity:.45}
.tag{font-size:12px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--line);white-space:nowrap}
.tag.ok{background:var(--acc);color:#1c0b10}
.x{width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--mute);font-size:22px;cursor:pointer}
.bar{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--mute);margin-bottom:10px}
.bar b{color:var(--ink)}
.status{position:sticky;top:0;z-index:5;margin:-20px -18px 14px;padding:8px 18px;font-size:13px;font-weight:800;text-align:center;background:var(--red);color:#fff;display:none}
.status.on{display:block}
.flip{perspective:1200px;height:320px;margin:8px 0 4px;cursor:pointer;user-select:none;-webkit-user-select:none}
.flip .in{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.back{background:repeating-linear-gradient(45deg,var(--bg2) 0 14px,var(--line) 14px 28px);border:3px solid var(--line)}
.back .q{width:110px;height:110px;border-radius:50%;background:var(--acc);color:#1c0b10;display:flex;align-items:center;justify-content:center;font:400 66px "Black Han Sans"}
.back p{margin:16px 0 0;font-weight:800;background:var(--bg);padding:6px 14px;border-radius:999px}
.front{background:var(--card);color:var(--cardink);transform:rotateY(180deg)}
.front .cat{font-weight:800;font-size:15px;opacity:.6}
.front .word{font:400 clamp(42px,13vw,62px) "Black Han Sans";margin:10px 0;word-break:keep-all}
.front .hint{font-size:13px;opacity:.55}
.info{background:var(--bg2);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px}
.vgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px}
.vbtn{min-height:64px;border-radius:16px;border:2px solid var(--line);background:var(--bg2);color:var(--ink);font:800 17px "Noto Sans KR";cursor:pointer;padding:6px;word-break:keep-all}
.vbtn.on{background:var(--acc);border-color:var(--acc);color:#1c0b10}
.vbtn:disabled{opacity:.35}
.meter{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--acc);transition:width .3s}
.result{text-align:center;padding:24px 16px;border-radius:24px;margin-bottom:10px}
.result.win{background:var(--acc);color:#1c0b10}
.result.lose{background:var(--red);color:#fff}
.result .big{font-size:40px;margin-bottom:8px}
.words{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px}
.words div{background:var(--bg2);border:2px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.words b{display:block;font:400 24px "Black Han Sans";margin-top:4px;word-break:keep-all}
.tally{display:grid;gap:6px;margin-top:12px}
.trow{display:grid;grid-template-columns:6em minmax(0,1fr) 2em;gap:8px;align-items:center;font-size:14px}
.trow .tb{height:12px;background:var(--bg2);border-radius:99px;overflow:hidden}.trow .tb i{display:block;height:100%;background:var(--mute)}
.trow.hot .tb i{background:var(--acc)}
.trow span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.trow span:last-child{text-align:right}
.timer{background:var(--bg2);border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin-top:12px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px}.timer .tl{font-weight:800;color:var(--mute)}.timer .tt{font:400 34px "Black Han Sans";font-variant-numeric:tabular-nums}.timer .meter{grid-column:1/-1;margin-top:4px}.timer.hurry .tt{color:var(--red)}.timer.hurry .meter i{background:var(--red)}
.wait{text-align:center;padding:30px 10px}
.spin{width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--acc);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.flip .in{transition:none}.spin{animation:none}}
</style>
</head>

<script>
{
const DATA = [
 ["술자리·안주", [["소주","막걸리"],["맥주","하이볼"],["삼겹살","곱창"],["치킨","족발"],["골뱅이무침","두부김치"],["감자탕","순대국"],["노가리","쥐포"],["회","육회"],["양꼬치","마라탕"],["짜장면","짬뽕"],["라면","우동"],["떡볶이","순대"],["해장국","콩나물국밥"],["오뎅탕","나가사키짬뽕"],["폭탄주","소맥"]]],
 ["추억의 00년대", [["싸이월드","페이스북"],["버디버디","네이트온"],["다마고치","탑블레이드"],["포켓몬빵 띠부씰","따조"],["MP3","CD플레이어"],["딱지","팽이"],["문방구","오락실"],["PC방","만화방"],["비디오가게","도서대여점"],["폴더폰","슬라이드폰"],["쫀드기","아폴로"],["알까기","지우개따먹기"],["삐삐","공중전화"],["롤러블레이드","씽씽카"],["도토리","별풍선"]]],
 ["군대", [["훈련소","자대"],["불침번","위병소 근무"],["행군","유격"],["전투화","전투복"],["PX","면회"],["휴가","외박"],["짬밥","뽀글이"],["이등병","병장"],["각개전투","사격"],["제설","낙엽 쓸기"],["점호","당직"],["생활관","연병장"],["군대리아","건빵"],["화생방","수류탄 투척"],["전역","예비군"]]],
 ["회사생활", [["회식","워크숍"],["연봉협상","성과급"],["야근","주말출근"],["팀장","부장"],["월급날","연말정산"],["출근길","퇴근길"],["엑셀","파워포인트"],["슬랙","단톡방"],["연차","병가"],["보고서","기획안"],["법인카드","경비처리"],["이직","퇴사"],["점심메뉴","커피내기"],["탕비실","흡연실"],["재택근무","외근"]]],
 ["게임", [["스타크래프트","워크래프트3"],["리니지","바람의나라"],["메이플스토리","라그나로크"],["카트라이더","크레이지아케이드"],["서든어택","카운터스트라이크"],["리그오브레전드","오버워치"],["피파","위닝일레븐"],["철권","킹오브파이터즈"],["테트리스","지뢰찾기"],["포트리스","건바운드"],["디아블로","던전앤파이터"],["배틀그라운드","발로란트"],["마인크래프트","심즈"],["고스톱","포커"],["롤 랭겜","칼바람"]]],
 ["스포츠", [["축구","풋살"],["야구","배구"],["농구","핸드볼"],["헬스","크로스핏"],["골프","스크린골프"],["볼링","당구"],["탁구","배드민턴"],["테니스","스쿼시"],["수영","서핑"],["마라톤","등산"],["복싱","주짓수"],["스키","스노보드"],["클라이밍","요가"],["월드컵","올림픽"],["손흥민","박지성"]]],
 ["장소", [["찜질방","사우나"],["PC방","노래방"],["편의점","마트"],["포장마차","호프집"],["한강공원","캠핑장"],["펜션","게스트하우스"],["결혼식장","돌잔치"],["헬스장","수영장"],["공항","기차역"],["놀이공원","워터파크"],["영화관","만화카페"],["클럽","헌팅포차"],["해수욕장","계곡"],["고깃집","횟집"],["예비군훈련장","동사무소"]]],
 ["물건", [["무선이어폰","헤드셋"],["아이폰","갤럭시"],["맥북","아이패드"],["플스","닌텐도 스위치"],["전동킥보드","자전거"],["로봇청소기","공기청정기"],["안마의자","폼롤러"],["텀블러","보온병"],["캠핑의자","돗자리"],["기계식 키보드","게이밍 마우스"],["면도기","전동칫솔"],["백팩","크로스백"],["선글라스","볼캡"],["넥타이","벨트"],["블랙박스","내비게이션"]]]
];
const RANDOM = DATA.length;
const ALPHA = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
const PREFIX = "liargame-kr30-";
const PEER_OPTS = {debug:0,config:{iceServers:[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:["turn:eu-0.turn.peerjs.com:3478","turn:us-0.turn.peerjs.com:3478"],username:"peerjs",credential:"peerjsp"}
]}};
const app = document.getElementById("app");
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const rid = n => Array.from({length:n},()=>ALPHA[Math.floor(Math.random()*32)]).join("");
// 탭마다 다른 참가자 (새로고침해도 유지)
const ss = {get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
const me = {cid: ss.get("liar.cid") || rid(10), name: ls.get("liar.name","")};
ss.set("liar.cid", me.cid);

let mode = "home";   // home | host | guest
let view = null;     // current view object being rendered
let peer = null, hostConn = null, retryT = null, left = false;
let cardOpen = false, hideT = null, lastWordKey = "";
let homeErr = "", homeTab = "join";

function setStatus(t){const s=document.getElementById("status");s.textContent=t||"";s.classList.toggle("on",!!t)}

/* =================== HOST ENGINE =================== */
let H = null;            // host state (saved)
const conns = {};        // cid -> conn
function newHostState(code){return {code,catSel:RANDOM,round:0,phase:"lobby",players:[{cid:me.cid,name:me.name}],inRound:[],liar:null,cw:"",lw:"",catName:"",first:null,votes:{},candidates:null,revote:false,result:null,used:[],talkSec:120,voteSec:60,deadline:null,phaseTotal:0,ready:{},ts:Date.now()}}
const pName = cid => (H.players.find(p=>p.cid===cid)||{}).name || "?";
const isOnline = cid => cid===me.cid || !!(conns[cid] && conns[cid].open);
function hostSave(){H.ts=Date.now();ls.set("liar.host",H)}

function addPlayer(cid,name){
  name=String(name||"").trim().slice(0,10)||"이름없음";
  const ex=H.players.find(p=>p.cid===cid);
  if(ex){ex.name=name;return true}
  if(H.players.length>=12)return false;
  H.players.push({cid,name});return true;
}
function pickPair(){
  const catIdx = H.catSel===RANDOM ? Math.floor(Math.random()*DATA.length) : H.catSel;
  const pairs = DATA[catIdx][1];
  let pool = pairs.map((_,i)=>i).filter(i=>!H.used.includes(catIdx+":"+i));
  if(!pool.length){H.used=H.used.filter(u=>!u.startsWith(catIdx+":"));pool=pairs.map((_,i)=>i)}
  const i = pool[Math.floor(Math.random()*pool.length)];
  H.used.push(catIdx+":"+i);
  const pr = pairs[i], swap = Math.random()<.5;
  return {catName:DATA[catIdx][0], cw:swap?pr[1]:pr[0], lw:swap?pr[0]:pr[1]};
}
function startRound(){
  const ids = H.players.filter(p=>isOnline(p.cid)).map(p=>p.cid);
  if(ids.length<3)return "온라인 인원이 3명 이상이어야 해요";
  const pk = pickPair();
  Object.assign(H,pk,{round:H.round+1,phase:"play",inRound:ids,liar:ids[Math.floor(Math.random()*ids.length)],first:ids[Math.floor(Math.random()*ids.length)],votes:{},candidates:null,revote:false,result:null,alive:ids.slice(),out:[],lastOut:null,turn:1});
  setTimer(H.talkSec||120);
  return null;
}
function setTimer(sec){H.deadline=Date.now()+sec*1000;H.phaseTotal=sec*1000;H.ready={}}
function startVote(){H.phase="vote";H.votes={};H.candidates=null;H.revote=false;setTimer(H.voteSec||60)}
function continueTalk(){H.phase="play";H.turn=(H.turn||1)+1;H.first=H.alive[Math.floor(Math.random()*H.alive.length)];H.votes={};H.candidates=null;H.revote=false;setTimer(H.talkSec||120)}
function advance(){
  if(H.phase==="play")startVote();
  else if(H.phase==="vote"){if(!Object.keys(H.votes).length){setTimer(30);return}tally();if(H.phase==="vote"&&!H.revote)setTimer(30)}
  else if(H.phase==="out")continueTalk();
}
function readyToggle(cid){
  if(!["play","out"].includes(H.phase)||!H.alive.includes(cid))return;
  if(H.ready[cid])delete H.ready[cid]; else H.ready[cid]=true;
  checkReady();
}
function checkReady(){
  if(!["play","out"].includes(H.phase))return;
  const need=H.alive.filter(isOnline);
  if(need.length&&need.every(c=>H.ready[c]))advance();
}
function castVote(voter,target){
  if(H.phase!=="vote"||!H.alive.includes(voter)||voter===target)return;
  const cands = H.candidates||H.alive;
  if(!cands.includes(target))return;
  H.votes[voter]=target;
  const need = H.alive.filter(isOnline);
  if(need.every(c=>H.votes[c]))tally();
}
function tally(){
  const cands = H.candidates||H.alive, cnt = {};
  cands.forEach(c=>cnt[c]=0);
  Object.values(H.votes).forEach(t=>{if(t in cnt)cnt[t]++});
  const max = Math.max(0,...Object.values(cnt));
  if(max===0)return;
  const top = cands.filter(c=>cnt[c]===max);
  if(top.length>1){H.candidates=top;H.votes={};H.revote=true;H.lastTie={names:top.map(pName),n:max};setTimer(H.voteSec||60);return}
  const target = top[0];
  const tl = H.alive.map(c=>({cid:c,n:cnt[c]||0})).sort((a,b)=>b.n-a.n);
  if(target===H.liar){H.phase="result";H.deadline=null;H.result={target,isLiar:true,liar:H.liar,tally:tl};return}
  H.out.push(target); H.alive=H.alive.filter(c=>c!==target); H.lastOut={target,tally:tl};
  if(H.alive.length<=2){H.phase="result";H.deadline=null;H.result={target,isLiar:false,survived:true,liar:H.liar,tally:tl};return}
  H.phase="out";setTimer(20);
}
function makeView(cid){
  const inR = H.inRound.includes(cid);
  const v = {
    code:H.code, phase:H.phase, me:cid, isHost:cid===me.cid, round:H.round, catSel:H.catSel,
    players:H.players.map(p=>({cid:p.cid,name:p.name,online:isOnline(p.cid),host:p.cid===me.cid,inRound:H.inRound.includes(p.cid),alive:(H.alive||[]).includes(p.cid),voted:!!H.votes[p.cid],ready:!!(H.ready||{})[p.cid]})),
    alive:(H.alive||[]).includes(cid), turn:H.turn||1, aliveN:(H.alive||[]).length, outNames:(H.out||[]).map(pName),
    inRound:inR, catName:H.phase==="lobby"?"":H.catName, firstName:H.first?pName(H.first):"",
    word: inR && H.phase!=="lobby" ? (cid===H.liar?H.lw:H.cw) : null,
    candidates:H.candidates||H.alive||[], revote:H.revote, tie:H.revote?H.lastTie:null,
    remainMs:H.deadline&&["play","vote","out"].includes(H.phase)?Math.max(0,H.deadline-Date.now()):null, totalMs:H.phaseTotal||0, talkSec:H.talkSec||120,
    meReady:!!(H.ready||{})[cid], readyN:(H.alive||[]).filter(c=>isOnline(c)&&(H.ready||{})[c]).length,
    myVote:H.votes[cid]||null, votedN:Object.keys(H.votes).length, needN:(H.alive||[]).filter(isOnline).length
  };
  if(H.phase==="out"){const o=H.lastOut;v.out={name:pName(o.target),isMe:o.target===cid,tally:o.tally.concat([{cid:o.target,n:0}]).filter((t,i,a)=>a.findIndex(x=>x.cid===t.cid)===i).map(t=>({name:pName(t.cid),n:t.n,hot:t.cid===o.target}))}}
  if(H.phase==="result"){
    const r=H.result;
    v.result={targetName:pName(r.target),isLiar:r.isLiar,survived:!!r.survived,liarName:pName(r.liar),iWasLiar:cid===r.liar,cw:H.cw,lw:H.lw,tally:r.tally.map(t=>({name:pName(t.cid),n:t.n,hot:t.cid===r.target}))};
  }

}
function broadcast(){
  hostSave();
  for(const cid in conns){const c=conns[cid];if(c.open){try{c.send({t:"state",view:makeView(cid)})}catch(e){}}}
  view = makeView(me.cid); render();
}
function hostAct(a,arg){
  let err=null;
  if(a==="cat"){H.catSel=arg}
  else if(a==="talk"){H.talkSec=arg}
  else if(a==="ready"){readyToggle(me.cid)}
  else if(a==="start"||a==="next"){err=startRound()}
  else if(a==="vote-start"){startVote()}
  else if(a==="continue"){continueTalk()}
  else if(a==="vote"){castVote(me.cid,arg)}
  else if(a==="tally"){tally()}
  else if(a==="kick"){if(arg!==me.cid){H.players=H.players.filter(p=>p.cid!==arg);H.inRound=H.inRound.filter(c=>c!==arg);H.alive=(H.alive||[]).filter(c=>c!==arg);if(conns[arg]){try{conns[arg].send({t:"kicked"});conns[arg].close()}catch(e){}delete conns[arg]}}}
  else if(a==="lobby"){H.phase="lobby"}
  broadcast();
  if(err)flash(err);
}
function startHost(resume){
  mode="host"; left=false;
  H = resume || newHostState(rid(4));
  if(!resume)hostSave();
  view = makeView(me.cid); render();
  openHostPeer(0);
}
function openHostPeer(tries){
  if(left)return;
  if(!window.Peer){setStatus("연결 라이브러리를 못 불러왔어요. 새로고침 해주세요");return}
  setStatus("방 여는 중…");
  peer = new Peer(PREFIX+H.code, PEER_OPTS);
  peer.on("open",()=>setStatus(""));
  peer.on("connection",conn=>{
    conn.on("data",d=>hostOnData(conn,d));
    conn.on("close",()=>{if(conn.cid&&conns[conn.cid]===conn){delete conns[conn.cid];onPlayerLeft()}});
    conn.on("error",()=>{});
  });
  peer.on("disconnected",()=>{if(!left&&!peer.destroyed){setStatus("서버 재연결 중…");try{peer.reconnect()}catch(e){}}});
  peer.on("error",e=>{
    if(e.type==="unavailable-id"){
      try{peer.destroy()}catch(_){}
      if(resumeAttempt){ if(tries<8){setStatus("방 다시 여는 중…");setTimeout(()=>openHostPeer(tries+1),2000)} else {setStatus("");flash("이 방 코드가 다른 데서 열려 있어요. 새 방을 만들어 주세요")} }
      else { H.code=rid(4); hostSave(); view=makeView(me.cid); render(); openHostPeer(tries+1); }
    } else if(e.type==="network"||e.type==="server-error"||e.type==="socket-error"||e.type==="socket-closed"){
      setStatus("인터넷 연결 확인 중…");
      try{peer.destroy()}catch(_){}
      setTimeout(()=>openHostPeer(tries+1),3000);
    }
  });
}
let resumeAttempt=false;
function onPlayerLeft(){
  if(H.phase==="vote"){const need=H.alive.filter(isOnline);if(need.length&&need.every(c=>H.votes[c]))tally()}
  checkReady();
  broadcast();
}
function hostOnData(conn,d){
  if(!d||typeof d!=="object")return;
  if(d.t==="hello"){
    const cid=String(d.cid||"").slice(0,20); if(!cid||cid===me.cid)return;
    if(!addPlayer(cid,d.name)){try{conn.send({t:"full"})}catch(e){};setTimeout(()=>conn.close(),300);return}
    conn.cid=cid;
    if(conns[cid]&&conns[cid]!==conn){try{conns[cid].close()}catch(e){}}
    conns[cid]=conn; broadcast();
  } else if(d.t==="vote"&&conn.cid){castVote(conn.cid,String(d.target)); broadcast()}
  else if(d.t==="ready"&&conn.cid){readyToggle(conn.cid); broadcast()}
}

/* =================== GUEST =================== */
let gCode="";
function startGuest(code){
  mode="guest"; left=false; gCode=code; view=null;
  ls.set("liar.guest",{code,ts:Date.now()});
  render();
  if(!window.Peer){setStatus("연결 라이브러리를 못 불러왔어요. 새로고침 해주세요");return}
  setStatus("방에 연결 중…");
  peer = new Peer(PEER_OPTS);
  peer.on("open",()=>guestConnect());
  peer.on("disconnected",()=>{if(!left&&!peer.destroyed){try{peer.reconnect()}catch(e){}}});
  peer.on("error",e=>{
    if(e.type==="peer-unavailable"){
      if(!view){setStatus("");goHome("방을 못 찾았어요. 코드 확인하거나 방장 폰 화면이 켜져 있는지 확인!");return}
      scheduleRetry();
    } else if(["network","server-error","socket-error","socket-closed"].includes(e.type)){scheduleRetry()}
  });
}
function scheduleRetry(){
  if(left)return; setStatus("방장 폰과 연결 끊김. 다시 연결 중…");
  clearTimeout(retryT); retryT=setTimeout(()=>{if(left)return;if(peer&&!peer.destroyed&&!peer.disconnected)guestConnect();else{try{peer.reconnect()}catch(e){}setTimeout(guestConnect,1500)}},2500);
}
function guestConnect(){
  if(left)return;
  try{if(hostConn)hostConn.close()}catch(e){}
  hostConn = peer.connect(PREFIX+gCode,{reliable:true});
  const c=hostConn; let opened=false;
  const to=setTimeout(()=>{if(!opened&&c===hostConn)scheduleRetry()},9000);
  c.on("open",()=>{opened=true;clearTimeout(to);setStatus("");c.send({t:"hello",cid:me.cid,name:me.name})});
  c.on("data",d=>{
    if(!d)return;
    if(d.t==="state"){view=d.view;render()}
    else if(d.t==="full"){left=true;goHome("방이 꽉 찼어요 (최대 12명)")}
    else if(d.t==="kicked"){left=true;goHome("방장이 내보냈어요")}
  });
  c.on("close",()=>{if(c===hostConn&&!left)scheduleRetry()});
  c.on("error",()=>{});
}
function guestVote(target){if(hostConn&&hostConn.open){hostConn.send({t:"vote",target});if(view){view.myVote=target;render()}}}

/* =================== COMMON =================== */
function act(a,arg){ if(mode==="host")hostAct(a,arg); else if(a==="vote")guestVote(arg); else if(a==="ready"&&hostConn&&hostConn.open){hostConn.send({t:"ready"});if(view){view.meReady=!view.meReady;render()}} }
setInterval(()=>{if(mode==="host"&&H&&H.deadline&&["play","vote","out"].includes(H.phase)&&Date.now()>=H.deadline){advance();broadcast()}},500);
function fmt(ms){const t=Math.max(0,Math.ceil(ms/1000));return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")}
function tickTimers(){for(const el of document.querySelectorAll(".timer")){const dl=+el.dataset.dl,tot=+el.dataset.tot,left=Math.max(0,dl-Date.now());el.querySelector(".tt").textContent=fmt(left);el.querySelector("i").style.width=(tot?Math.min(100,left/tot*100):0)+"%";el.classList.toggle("hurry",left<=10000)}}
setInterval(tickTimers,250);
function timerHtml(v,label){if(v.remainMs==null)return "";if(!v._dl)v._dl=Date.now()+v.remainMs;return `<div class="timer" data-dl="${v._dl}" data-tot="${v.totalMs}"><span class="tl">${label}</span><b class="tt">${fmt(v._dl-Date.now())}</b><div class="meter"><i></i></div></div>`}
function readyBtn(v,txt){if(!v.alive)return `<p class="mute small" style="text-align:center;margin-top:14px">남은 사람들이 진행 중…</p>`;return `<button class="btn ${v.meReady?"":"pri"}" data-a="ready">${v.meReady?"✓ 기다리는 중 (취소)":txt} · ${v.readyN}/${v.needN}</button>`}

}
function renderHome(){
  const hashCode=(location.hash||"").slice(1).toUpperCase().replace(/[^0-9A-Z]/g,"").slice(0,4);
  if(hashCode.length===4)homeTab="join";
  const sh=ls.get("liar.host",null), sg=ls.get("liar.guest",null), fresh=x=>x&&Date.now()-x.ts<3*3600e3;
  app.innerHTML=`<h1>라이어<br>게임</h1>
  <p class="mute">각자 폰으로 제시어 보고, 토크는 얼굴 보고, 투표는 폰으로.<br>라이어 본인도 자기가 라이어인 줄 몰라요.</p>
  ${hashCode.length===4?"":`<div class="hero" aria-hidden="true"><div class="c c1">?</div><div class="c c2">?</div><div class="c c3">?</div></div>`}
  <div class="label">내 이름</div><input class="txt" id="nameIn" maxlength="10" placeholder="예: 민수" value="${esc(me.name)}" autocomplete="off">
  ${hashCode.length===4?`<div class="label">방 코드</div><input class="txt code" id="codeIn" maxlength="4" value="${esc(hashCode)}" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn pri" data-a="join">참가하기</button>`:
  `<button class="btn pri" data-a="create">방 만들기</button><div class="label">친구 방에 들어가기</div><input class="txt code" id="codeIn" maxlength="4" placeholder="코드" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn" data-a="join">참가하기</button>`}
  <div class="err" id="homeErr">${esc(homeErr)}</div>
  ${fresh(sh)?`<button class="btn ghost" data-a="resume-host">방장으로 이어하기 (방 ${esc(sh.code)})</button>`:""}
  ${fresh(sg)&&hashCode.length!==4?`<button class="btn ghost" data-a="resume-guest">다시 들어가기 (방 ${esc(sg.code)})</button>`:""}
  <details style="margin-top:18px"><summary class="mute">게임 방법</summary><ol class="mute small" style="padding-left:20px">
  <li>한 명이 방 만들고 링크를 단톡에 뿌려요. 방장 폰 화면은 켜두기.</li>
  <li>다들 링크 열고 이름 쓰고 참가. 방장이 카테고리 고르고 시작.</li>
  <li>카드 뒤집으면 제시어. 한 명만 비슷한 <b>다른 단어</b>를 받는데 그게 라이어. 본인은 몰라요.</li>
  <li>순서대로 한 마디씩 설명. 다들 "투표하자"를 누르거나 토크 시간이 끝나면 각자 폰으로 투표 (60초).</li>
  <li>최다 득표자가 시민이면 그 사람만 탈락하고, 남은 사람끼리 다시 토크·투표. 라이어를 잡으면 시민 승, 라이어가 최후 2인까지 살아남으면 라이어 승. 동점이면 재투표.</li></ol></details>`;
}
function readName(){
  const n=(document.getElementById("nameIn").value||"").trim().slice(0,10);
  if(!n){homeErr="이름부터 써주세요";document.getElementById("homeErr").textContent=homeErr;document.getElementById("nameIn").focus();return false}
  me.name=n;ls.set("liar.name",n);return true;
}

app.addEventListener("click",async e=>{
  const f=e.target.closest("#flip");
  if(f){cardOpen=!cardOpen;f.classList.toggle("open",cardOpen);clearTimeout(hideT);if(cardOpen)hideT=setTimeout(()=>{cardOpen=false;const g=document.getElementById("flip");if(g)g.classList.remove("open")},5000);return}
  const b=e.target.closest("[data-a]"); if(!b||b.disabled)return;
  const a=b.dataset.a, v=b.dataset.v;
  if(a==="create"){if(!readName())return;resumeAttempt=false;startHost(null)}
  else if(a==="join"){if(!readName())return;const c=(document.getElementById("codeIn").value||"").toUpperCase().trim();if(c.length!==4){document.getElementById("homeErr").textContent="방 코드 4자리를 써주세요";return}history.replaceState(null,"",location.pathname);startGuest(c)}
  else if(a==="resume-host"){const sh=ls.get("liar.host",null);if(!sh)return;me.cid=sh.players[0].cid;ss.set("liar.cid",me.cid);me.name=(sh.players.find(p=>p.cid===me.cid)||{}).name||me.name;resumeAttempt=true;startHost(sh)}
  else if(a==="resume-guest"){const sg=ls.get("liar.guest",null);if(!sg||!me.name){if(!readName())return}startGuest(sg.code)}
  else if(a==="leave")leave();
  else if(a==="copy"){const txt=`🕵️ 라이어게임 ㄱㄱ\n링크 열고 이름만 쓰면 바로 참가!\n${shareLink(view.code)}\n(방 코드: ${view.code})`;
    try{await navigator.clipboard.writeText(txt);document.getElementById("copyMsg").textContent="복사됨! 단톡에 붙여넣기 하세요."}
    catch(err){const m=document.getElementById("copyMsg");m.innerHTML="복사가 막혔어요. 이 링크를 꾹 눌러 복사하세요:<br><b style='user-select:all;word-break:break-all'>"+esc(shareLink(view.code))+"</b>"}}
  else if(a==="cat")act("cat",+v);
  else if(a==="talk")act("talk",+v);
  else if(a==="vote"){if(view&&view.myVote===v)return;act("vote",v)}
  else act(a,v);
});
app.addEventListener("keydown",e=>{if(e.target.id==="flip"&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.click()}if(e.key==="Enter"&&(e.target.id==="codeIn"||e.target.id==="nameIn")){const b=app.querySelector('[data-a="join"]');if(e.target.id==="codeIn"||(b&&document.getElementById("codeIn").value.length===4))b&&b.click()}});
app.addEventListener("input",e=>{if(e.target.id==="codeIn"){e.target.value=e.target.value.toUpperCase().replace(/[^0-9A-Z]/g,"")}});
window.addEventListener("hashchange",()=>{if(mode==="home")render()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&mode==="guest"&&hostConn&&!hostConn.open&&!left)scheduleRetry()});

window.__liar={get H(){return H},set H(x){H=x},newHostState,addPlayer,startRound,startVote,castVote,tally,makeView,me,conns};
render();
}
</script>
